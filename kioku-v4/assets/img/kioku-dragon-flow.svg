<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 362 362" aria-hidden="true">
<!-- Original KIOKU atmospheric dragon. Decorative, not a product image or cultural emblem. -->
<style>
.dragon-flight{transform-origin:50% 50%;animation:kioku-glide 6.6s ease-in-out infinite}
.dragon-frame{fill:#6A769A;fill-opacity:.10;stroke:#34405F;stroke-opacity:.76;stroke-width:1.7;stroke-linejoin:round;opacity:0}
.frame-a{opacity:.92;animation:kioku-phase-a 6.6s ease-in-out infinite}
.frame-b{animation:kioku-phase-b 6.6s ease-in-out infinite}
.frame-c{animation:kioku-phase-c 6.6s ease-in-out infinite}
@keyframes kioku-glide{0%,100%{transform:translate(0,3px) rotate(-1deg)}50%{transform:translate(3px,-6px) rotate(1deg)}}
@keyframes kioku-phase-a{0%,24%,100%{opacity:.92}33%,84%{opacity:0}}
@keyframes kioku-phase-b{0%,24%,100%{opacity:0}33%,57%{opacity:.92}66%{opacity:0}}
@keyframes kioku-phase-c{0%,57%,100%{opacity:0}66%,84%{opacity:.92}}
@media(prefers-reduced-motion:reduce){.dragon-flight,.dragon-frame{animation:none!important}.frame-a{opacity:.92}.frame-b,.frame-c{opacity:0}}
</style>
